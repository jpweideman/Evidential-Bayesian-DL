num_epochs: 3000
device: auto

pretrained:
  enabled: false
  path: null

loss:
  name: dirichlet_multinomial_count_nll

likelihood:
  name: dirichlet_multinomial

prior:
  name: diagonal_normal
  params:
    sd: 1.0
    normalize: false

prior_fs:
  name: gamma_strength
  params:
    concentration: 27   # prior sd = 20% of the level
    rate: 0.52          # level 50


# lr = 6.1 x the BNN's 2e-4: equal SGLD steps per measured likelihood gradient scale.
sampler:
  name: sgld
  params:
    lr: 0.0012
    temperature: 1.0

# 40 snapshots after the burn-in: 2220, 2240, ..., 3000
sampling:
  enabled: true
  start_epoch: 2220
  sample_interval: 20

checkpoint:
  enabled: true
  metric: count_accuracy
  objective: maximize

early_stopping:
  enabled: false

wandb:
  enabled: true
  project: evidential-bayesian-dl
  name: null
  log_interval: 20
